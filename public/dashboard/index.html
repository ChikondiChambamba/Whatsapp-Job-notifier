<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vacancy Bot KPIs</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fb;
        --panel: #ffffff;
        --text: #172033;
        --muted: #667085;
        --line: #d8dee9;
        --ok: #147a46;
        --warn: #b54708;
        --accent: #2563eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.1;
      }

      .muted {
        color: var(--muted);
        font-size: 14px;
      }

      .freshness {
        min-width: 260px;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 8px;
        padding: 12px 14px;
      }

      .freshness strong {
        display: block;
        margin-bottom: 4px;
      }

      .freshness.ok strong {
        color: var(--ok);
      }

      .freshness.stale strong {
        color: var(--warn);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .card {
        min-height: 96px;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 8px;
        padding: 16px;
      }

      .value {
        font-size: 30px;
        font-weight: 750;
        line-height: 1;
      }

      .label {
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .section {
        margin-top: 18px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }

      canvas {
        width: 100%;
        max-height: 280px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      th,
      td {
        border-top: 1px solid var(--line);
        padding: 10px 0;
        text-align: left;
      }

      th:last-child,
      td:last-child {
        text-align: right;
      }

      @media (max-width: 760px) {
        header,
        .section {
          grid-template-columns: 1fr;
          display: grid;
        }

        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .freshness {
          min-width: 0;
        }
      }

      @media (max-width: 500px) {
        main {
          width: min(100% - 20px, 1180px);
          padding-top: 18px;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Vacancy Bot KPIs</h1>
          <div class="muted">Rolling 24-hour dashboard</div>
        </div>
        <div id="freshness" class="freshness stale">
          <strong>No messages recorded</strong>
          <span class="muted">Waiting for the bot to score messages.</span>
        </div>
      </header>

      <section class="grid" id="cards"></section>

      <section class="section">
        <div class="card">
          <h2>Categories</h2>
          <canvas id="categoryChart"></canvas>
        </div>
        <div class="card">
          <h2>Top Sources</h2>
          <canvas id="sourceChart"></canvas>
        </div>
      </section>

      <section class="section">
        <div class="card">
          <h2>Score Stats</h2>
          <table>
            <thead>
              <tr>
                <th>Type</th>
                <th>Min</th>
                <th>Avg</th>
                <th>Max</th>
              </tr>
            </thead>
            <tbody id="scoreStats"></tbody>
          </table>
        </div>
        <div class="card">
          <h2>Status</h2>
          <table>
            <tbody id="statusRows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const staleAfterMs = 60 * 60 * 1000;
      let categoryChart;
      let sourceChart;

      async function loadStats() {
        const response = await fetch('/api/stats');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const stats = await response.json();
        renderCards(stats);
        renderFreshness(stats.lastMessageAt);
        renderScoreStats(stats.scoreStats);
        renderStatus(stats);
        categoryChart = renderChart(
          categoryChart,
          'categoryChart',
          Object.keys(stats.categoryBreakdown),
          Object.values(stats.categoryBreakdown),
        );
        sourceChart = renderChart(
          sourceChart,
          'sourceChart',
          stats.topSources.map((source) => source.sourceName),
          stats.topSources.map((source) => source.count),
        );
      }

      function renderCards(stats) {
        const items = [
          [stats.totalScored, 'Messages Scored'],
          [`${stats.eligibleCount} (${stats.eligiblePct}%)`, 'Eligible Field Signals'],
          [`${stats.matchedCount} (${stats.matchedPct}%)`, 'Full Matches'],
          [stats.emailsSent, 'Emails Sent'],
          [stats.emailsFailed, 'Emails Failed'],
          [stats.blastSuppressedCount, 'Blast Suppressed'],
        ];

        document.getElementById('cards').innerHTML = items
          .map(
            ([value, label]) => `
              <div class="card">
                <div class="value">${value}</div>
                <div class="label">${label}</div>
              </div>
            `,
          )
          .join('');
      }

      function renderFreshness(lastMessageAt) {
        const box = document.getElementById('freshness');
        if (!lastMessageAt) {
          box.className = 'freshness stale';
          box.innerHTML =
            '<strong>No messages recorded</strong><span class="muted">Waiting for scored messages.</span>';
          return;
        }

        const ageMs = Date.now() - lastMessageAt;
        const isStale = ageMs > staleAfterMs;
        box.className = `freshness ${isStale ? 'stale' : 'ok'}`;
        box.innerHTML = `
          <strong>${isStale ? 'Stale' : 'Fresh'}</strong>
          <span class="muted">Last scored ${formatAge(ageMs)} ago</span>
        `;
      }

      function renderScoreStats(scoreStats) {
        document.getElementById('scoreStats').innerHTML = ['matched', 'unmatched']
          .map((key) => {
            const row = scoreStats[key];
            return `
              <tr>
                <td>${title(key)}</td>
                <td>${formatNumber(row.min)}</td>
                <td>${formatNumber(row.avg)}</td>
                <td>${formatNumber(row.max)}</td>
              </tr>
            `;
          })
          .join('');
      }

      function renderStatus(stats) {
        document.getElementById('statusRows').innerHTML = `
          <tr><td>Window</td><td>${Math.round(stats.windowMs / 3600000)}h</td></tr>
          <tr><td>Last refresh</td><td>${new Date().toLocaleTimeString()}</td></tr>
        `;
      }

      function renderChart(existingChart, id, labels, values) {
        const context = document.getElementById(id);
        if (existingChart) existingChart.destroy();

        return new Chart(context, {
          type: 'bar',
          data: {
            labels,
            datasets: [
              {
                data: values,
                backgroundColor: '#2563eb',
                borderRadius: 4,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
          },
        });
      }

      function formatAge(ms) {
        const minutes = Math.floor(ms / 60000);
        if (minutes < 1) return 'less than a minute';
        if (minutes < 60) return `${minutes} min`;
        return `${Math.floor(minutes / 60)} hr ${minutes % 60} min`;
      }

      function formatNumber(value) {
        return value === null ? '-' : Number(value).toFixed(1).replace(/\.0$/, '');
      }

      function title(value) {
        return value.slice(0, 1).toUpperCase() + value.slice(1);
      }

      loadStats().catch(console.error);
      setInterval(() => loadStats().catch(console.error), 30000);
    </script>
  </body>
</html>
